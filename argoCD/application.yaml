apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: transacciones-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jorgeme0996/transacciones-api.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: transacciones-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true