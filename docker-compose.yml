services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider-mock:
    build: .
    command: node mock/server.js
    environment:
      MOCK_API_KEY: ${PROVIDER_API_KEY}
      MOCK_PORT: 3001

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PROVIDER_URL: http://provider-mock:3001
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      provider-mock:
        condition: service_started
    command: sh -c "yarn migration:run && node dist/main"

volumes:
  db-data: