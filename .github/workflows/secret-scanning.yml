name: Secret Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicitly guarantee the SARIF report artifact instead of relying on an
          # unverified action default -- the risk-assessment workflow downloads it
          # by run id to normalize secret findings (see risk-engine/README.md).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
