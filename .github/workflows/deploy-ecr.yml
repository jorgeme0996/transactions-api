name: Build & Push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ecr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: transacciones-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::388839923332:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Bump image tag en manifiestos (GitOps)
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMG: 388839923332.dkr.ecr.us-east-1.amazonaws.com/transacciones-api
        run: |
          curl -sLo /usr/local/bin/kustomize https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize
          # (o instala kustomize como prefieras)
          cd k8s
          kustomize edit set image "$IMG=$IMG:$IMAGE_TAG"
          cd ..
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "chore: deploy $IMAGE_TAG [skip ci]" || echo "sin cambios"
          git push
