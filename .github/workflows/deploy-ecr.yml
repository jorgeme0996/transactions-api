name: Build & Push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ecr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: transacciones-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::388839923332:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"
          echo "Imagen subida: $IMAGE:$IMAGE_TAG"

      - name: Bump image tag en manifiestos (GitOps)
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMG: 388839923332.dkr.ecr.us-east-1.amazonaws.com/transacciones-api
        run: |
          # yq viene preinstalado en el runner de GitHub; no instalamos nada
          yq -i '(.images[] | select(.name == strenv(IMG)) | .newTag) = strenv(IMAGE_TAG)' k8s/kustomization.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yml
          git commit -m "chore: deploy ${IMAGE_TAG} [skip ci]" || echo "sin cambios"
          git push
